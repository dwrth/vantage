name: Release

# Publishes to npm with trusted publishing (OIDC): no NPM_TOKEN. The trusted publisher on
# npmjs.com is configured for this workflow file name (release.yml) without an environment.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Check that the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npx tsc -p tsconfig.lib.json --noEmit
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
